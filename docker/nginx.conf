map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $slg_api api:8080;
    index index.html;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /ws {
        proxy_pass http://$slg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
    }
    location /auth/ {
        proxy_pass http://$slg_api;
        add_header Cache-Control "no-store" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location = /health { proxy_pass http://$slg_api; }
    location /agent-api/ { proxy_pass http://$slg_api; }
    location = /agent-api.md { proxy_pass http://$slg_api; }
    location = /agent-api.json { proxy_pass http://$slg_api; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
